name: mindme
services:
  mindme:
    image: mindme:${MINDME_RELEASE:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        NODE_IMAGE: ${MINDME_NODE_IMAGE:-node:24-bookworm-slim}
    restart: unless-stopped
    init: true
    env_file: server.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3180
      DATABASE_PATH: /var/lib/mindme/mindme.sqlite
      STATIC_DIR: /app/dist
    ports:
      - '127.0.0.1:${MINDME_PORT:-3180}:3180'
    volumes:
      - mindme-data:/var/lib/mindme
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${MINDME_MEMORY_LIMIT:-768m}
    cpus: ${MINDME_CPUS:-1.0}
    stop_grace_period: 15s
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3180/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  mindme-data:
