name: 问题反馈
description: 报告可复现的功能问题
labels: []
body:
  - type: markdown
    attributes:
      value: |
        请使用演示数据。不要上传私人脑图、真实配置、Cookie、数据库、设置令牌或恢复码。安全漏洞请按 SECURITY.md 私下报告。
  - type: input
    id: version
    attributes:
      label: mindme 版本
      placeholder: 例如 0.1.1
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、浏览器版本、纯本地或自托管、Node.js 版本。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 使用最少节点和不含个人信息的内容描述操作。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 已脱敏的截图或错误信息
      description: 提交前确认附件不含个人信息、凭据或私有服务器地址。
