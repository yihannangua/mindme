name: 功能建议
description: 描述使用场景和期望行为
body:
  - type: markdown
    attributes:
      value: 请勿上传私人脑图或生产配置。较大的功能请先讨论，再开始实现。
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景与当前困难
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望行为
      description: 请说明希望完成什么，以及是否尝试过现有方式。
    validations:
      required: true
