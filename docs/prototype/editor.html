<head>

<title>mindme · 编辑器交互草图</title>
<style>
:root{--ink:#293640;--sub:#849099;--line:#e3e8ec;--paper:#fff;--bg:#f5f7f9;--red:#d75a4e;--blue:#4b81a9;--green:#508c79;--amber:#b88d45;--purple:#8b78a7}*{box-sizing:border-box}body{margin:0;font:13px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid transparent;background:transparent;color:inherit;border-radius:6px;padding:7px 10px}button:hover{background:#eef2f5}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #5290be;outline-offset:2px}button:disabled{opacity:.38;cursor:not-allowed}input,textarea,select{border:1px solid var(--line);border-radius:6px;padding:9px 10px;background:white;color:var(--ink)}button.primary{background:var(--red);color:white}button.primary:hover{background:#bd493f}.danger{color:#b84a40}.muted{color:var(--sub)}.small{font-size:11px}.reviewbar{height:34px;background:#f0f3f6;border-bottom:1px solid #dce3e8;display:flex;align-items:center;justify-content:space-between;padding:0 18px;color:#6d7a85;font-size:11px;letter-spacing:.3px}.reviewbar b{color:#536879}.reviewbar button{padding:3px 9px;font-size:11px;border:1px solid #d4dde5;background:white}.top{height:54px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:24px;padding:0 20px}.brand{font-size:21px;font-weight:750;letter-spacing:-1px;display:flex;align-items:center;gap:8px}.brand i{display:block;width:22px;height:22px;border:5px solid var(--red);border-radius:6px;transform:rotate(-12deg)}.space{font-size:12px;color:#6c7c86;border-left:1px solid var(--line);padding-left:22px}.top-right{margin-left:auto;display:flex;align-items:center;gap:12px}.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--green);padding:5px 9px;background:#f1f7f4;border-radius:5px}.sync.warn{color:#a77e37;background:#fcf7eb}.sync.error{color:#b85648;background:#fff0ed}.dot{height:6px;width:6px;background:currentColor;border-radius:50%}.avatar{background:#eaf0f3;color:#557180;width:29px;height:29px;border-radius:50%;display:grid;place-items:center;font-size:11px}.layout{height:calc(100vh - 88px);display:grid;--left-width:200px;--right-width:234px;grid-template-columns:var(--left-width) minmax(0,1fr) var(--right-width);min-height:590px}.sidebar{background:#f8fafb;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:19px 12px 12px}.sidebar .new{border:1px solid #d9e1e7;background:white;width:100%;text-align:left;font-weight:600;margin-bottom:25px}.label{font-size:10px;color:#8a969e;font-weight:600;letter-spacing:1.4px;margin:0 10px 10px}.files{display:flex;flex-direction:column;gap:4px}.file{display:flex;align-items:center;gap:9px;text-align:left;width:100%;padding:10px 9px;font-size:12px}.file.active{background:#eaf0f4;color:#365d78}.file .fileicon{color:#8296a5;font-size:15px}.file .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.filesempty{margin:10px;color:#8996a0;font-size:12px}.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:10px}.side-bottom button{width:100%;text-align:left;font-size:12px;color:#697b88}.sidehint{font-size:10px;color:#99a3aa;margin:12px 10px 0}.editor{min-width:0;background:white;display:flex;flex-direction:column;overflow:hidden}.tabs{height:43px;background:#f3f6f8;border-bottom:1px solid var(--line);display:flex;align-items:stretch;padding-left:6px;overflow:auto;flex-shrink:0}.tab{display:flex;align-items:center;gap:8px;min-width:138px;max-width:200px;border-right:1px solid var(--line);padding:0 10px;border-radius:0;font-size:12px;color:#788793}.tab.active{background:white;color:#354b5c;box-shadow:inset 0 2px var(--red);border-bottom:1px solid white}.tab .tabname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.tab .pin{font-size:10px;color:#9eabb3}.tab .close{font-size:16px;color:#96a2ac;border-radius:3px;padding:0 3p etween;font-size:10px;color:#8a98a2;padding:0 18px;flex-shrink:0}.inspector{border-left:1px solid var(--line);background:#fff;display:flex;flex-direction:column;overflow:auto}.inspector-head{height:43px;padding:12px 17px;border-bottom:1px solid var(--line);font-size:12px;font-weight:600}.panel{padding:17px;border-bottom:1px solid var(--line)}.panel h3{font-size:11px;font-weight:600;margin:0 0 12px}.panel input{width:100%;font-size:12px}.panel .row{display:flex;justify-content:space-between;margin:10px 0;font-size:11px;color:#8898a4}.marker-title{font-size:10px;color:#83939f;margin:17px 0 7px}.markers{display:flex;gap:6px;flex-wrap:wrap}.marker{display:grid;place-items:center;height:36px;width:36px;padding:3px;border:1px solid transparent;background:white}.marker:hover{background:#f0f5f8;border-color:#dce5eb}.marker-icon{display:block;flex-shrink:0;pointer-events:none}.node .node-marker text{fill:currentColor;font-weight:400}.marker.active{border-color:#6a9cbd;background:#ecf4fa;box-shadow:0 0 0 1px #6a9cbd}.inspector .wide{width:100%;border:1px solid var(--line);font-size:11px;margin-top:8px}.note{font-size:11px;color:#85949e;line-height:1.8;margin:7px 0 0}.scenario{margin-top:auto;background:#f7f9fb;padding:14px}.scenario h3{font-size:10px;color:#7c8d9b;letter-spacing:.8px;margin:0 0 9px}.scenario select{width:100%;font-size:11px;padding:7px}.scenario p{font-size:10px;color:#8696a1;margin:9px 0 0;line-height:1.8}.scenario button{font-size:11px;border:1px solid #dce4eb;width:100%;background:white;margin-top:8px}.toast{position:fixed;bottom:50px;left:50%;transform:translateX(-50%);padding:10px 17px;background:#314a5c;color:white;border-radius:7px;box-shadow:0 5px 20px #263c4c22;z-index:30;font-size:12px;max-width:80vw}.toast[hidden]{display:none}.overlay{position:fixed;inset:0;background:#263c4d40;z-index:20;display:flex;align-items:center;justify-content:center;padding:30px;backdrop-filter:blur(2px)}.overlay[hidden]{display:none}.modal{background:#fff;width:590px;max-width:95vw;max-height:85vh;overflow:auto;border-radius:13px;box-shadow:0 20px 80px #20364730}.modal-head{padding:19px 23px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.modal-head h2{margin:0;font-size:16px;font-weight:650}.modal-head button{font-size:19px;line-height:18px;padding:3px 7px;color:#8a9aa5}.modal-body{padding:21px 24px 25px}.modal-body p{margin:0 0 15px;font-size:12px;color:#7b8d9a;line-height:1.9}.modal-body label{display:block;font-size:11px;font-weight:600;margin:15px 0 7px}.modal-body textarea{width:100%;height:160px;resize:vertical;line-height:1.8;font:12px/1.8 ui-monospace,monospace}.modal-footer{display:flex;justify-content:flex-end;gap:7px;margin-top:20px}.pill{display:inline-block;border-radius:4px;background:#eef4f8;color:#6d8ba1;padding:2px 6px;font-size:10px;margin-left:6px}.choice-row{display:flex;align-items:center;gap:13px;border:1px solid var(--line);border-radius:8px;padding:13px;margin-top:10px}.choice-row .symbol{font-size:21px;background:#f2f6f9;border-radius:6px;width:38px;height:38px;display:grid;place-items:center;color:#7b95a8}.choice-row .grow{flex:1}.choice-row b{font-size:12px;display:block}.choice-row small{font-size:10px;color:#91a0aa}.choice-row button{font-size:11px;border:1px solid #dce5eb}.warning{border:1px solid #eddfbf;background:#fffaf0;padding:12px;border-radius:7px;color:#9a7a3e;font-size:11px;margin-top:12px;line-height:1.8}.review-choice{border-left:3px solid #8aa8bd;background:#f3f7fa;padding:11px 13px;font-size:11px;color:#6c8699;line-height:1.9;margin:14px 0}.blank{text-align:center;color:#99a7b1;padding:35px 0}.split-actions{display:flex;gap:6px;flex-wrap:wrap}.split-actions button{font-size:11px;border:1px solid var(--line)}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:1100px){.layout{--left-width:170px;--right-width:208px}.toolbar .tooltitle{display:none}.top{gap:12px}.space{padding-left:12px}.inspector .panel{padding:13px}}@media(max-width:780px){.layout{grid-template-columns:1fr;min-height:600px}.sidebar,.inspector{display:none}.toolbar{overflow:auto}.reviewbar span:last-of-type{display:none}.space{display:none}.top{padding:0 13px}.modal{width:95vw}.canvas{min-height:450px}}@media(prefers-reduced-motion:no-preference){.node:not(.dragging){transition:opacity .12s}.toast{animation:pop .15s ease-out}@keyframes pop{from{opacity:0;bottom:45px}to{opacity:1;bottom:50px}}}

.layout>.sidebar{grid-column:1;grid-row:1}.layout>.editor{grid-column:2;grid-row:1}.layout>.inspector{grid-column:3;grid-row:1}
.layout.left-collapsed{--left-width:0px}.layout.right-collapsed{--right-width:0px}
.layout.left-collapsed>.sidebar,.layout.right-collapsed>.inspector{display:none}
.toolbar .side-toggle{width:30px;min-width:30px;height:30px;padding:4px;font-size:16px;color:#6b8190;border:1px solid #e1e7ec;background:#fff}
.toolbar .side-toggle[aria-expanded="false"]{color:#497da0;background:#edf5fa;border-color:#cbdfe9}
.toolbar{overflow-x:auto}.toolbar .right{min-width:4px}
@media(max-width:780px){.toolbar .side-toggle{display:none}.layout>.editor{grid-column:1}}

.node.editing{cursor:text}.node.editing>text{visibility:hidden}
.node .inline-editor{width:100%;height:100%;resize:none;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-all;border:0;border-radius:3px;background:#fff;color:#29485d;padding:2px 4px;outline:1px solid #5e9bbf;font:12px/20px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;box-sizing:border-box;user-select:text;cursor:text}
.node.root .inline-editor{font-size:15px;font-weight:650;line-height:22px}

.graph{cursor:grab}.graph.is-panning,.graph.is-panning .node{cursor:grabbing}

.shortcut-table{width:100%;border-collapse:collapse;font-size:12px}.shortcut-table td{padding:9px 3px;border-bottom:1px solid var(--line);vertical-align:top}.shortcut-table td:first-child{width:140px;color:#56788f}.shortcut-table kbd{font:12px ui-monospace,monospace;white-space:nowrap}
</style>

<body>
<div class="reviewbar"><span><b>交互草图 · 0.1</b>　可点击体验，刷新后重置</span><span>演示数据 · 登录、云同步和版本保存为模拟；XMind 8 文件在本机解析</span><button id="review">查看评审说明</button></div>
<header class="top"><div class="brand"><i></i>mindme</div><span class="space">个人空间　⌄</span><div class="top-right"><span class="small muted" id="device">当前设备：MacBook</span><button class="sync" id="sync"><span class="dot"></span><span id="sync-text">已同步 · 模拟</span></button><button class="avatar" id="account" title="指定 Google 账号" aria-label="账号与访问">我</button></div></header>
<div class="layout">
<aside class="sidebar" id="left-sidebar" aria-label="脑图列表"><button class="new" id="new">＋　新建脑图</button><div class="label">我的脑图 <span id="count"></span></div><div class="files" id="files"></div><div class="side-bottom"><button data-dialog="import">⇣　导入内容</button><button data-dialog="backup">↗　备份与恢复</button><button data-dialog="trash">▢　回收站 <span id="trash-count"></span></button><button data-dialog="login">◎　账号与访问</button><div class="sidehint">Mac · 个人使用</div></div></aside>
<main class="editor"><nav class="tabs" id="tabs" aria-label="已打开脑图"></nav><div class="toolbar"><button class="side-toggle" id="toggle-left" aria-label="收起左侧脑图列表" title="收起左侧脑图列表" aria-controls="left-sidebar" aria-expanded="true">◧</button><span class="sep"></span><span class="tooltitle">脑图</span><button id="add">＋ 子主题 <span class="muted small">Tab</span></button><button id="sibling">＋ 同级主题</button><span class="sep"></span><button id="fold" title="折叠或展开当前节点一级，保留后代折叠状态">折叠 / 展开分支</button><button id="fold-all" title="折叠或展开选中节点下的所有子节点">全部折叠 / 展开</button><button id="undo" title="撤销当前设备的操作 · ⌘Z">↶ 撤销</button><button id="redo" title="重做当前脑图的操作 · ⇧⌘Z">↷ 重做</button><span class="right"></span><button data-dialog="import">导入</button><button data-dialog="history">◷ 历史版本</button><button id="save" title="手动触发模拟保存 · ⌘S">保存</button><button id="shortcuts" title="查看已实现快捷键">快捷键</button><button id="more">•••</button><span class="sep"></span><button class="side-toggle" id="toggle-right" aria-label="收起右侧节点面板" title="收起右侧节点面板" aria-controls="right-sidebar" aria-expanded="true">◨</button></div><div class="canvas" id="canvas"><div class="canvas-caption">顺时针平衡图　/　<span id="caption"></span></div><svg class="graph" id="graph" tabindex="-1" viewBox="0 0 1100 650" role="img" aria-label="可编辑脑图，滚轮缩放画布，空白处左键拖动画布，双击节点修改文字，拖动节点调整位置"></svg><div class="canvas-footer">滚轮缩放画布　·　空白处左键拖动　·　双击节点改字</div><div class="zoom"><button id="zoom-out" aria-label="缩小">−</button><span id="zoom-value">100%</span><button id="zoom-in" aria-label="放大">＋</button><button id="fit">适应</button></div></div><footer class="statusbar"><span id="node-count"></span><span id="event">自动布局 · 随节点变化重新计算</span></footer></main>
<aside class="inspector" id="right-sidebar" aria-label="节点与标记面板"><div class="inspector-head">节点</div><div class="panel"><h3>主题文字</h3><input id="node-label" aria-label="主题文字"><div class="row"><span>层级</span><span id="node-level"></span></div><div class="split-actions"><button id="edit-node">编辑</button><button id="delete-node" class="danger">删除分支</button></div><p class="note" id="selection-note"></p></div><div class="panel"><h3>常用标记 <span class="muted small">分类参考 XMind 8</span></h3><div class="marker-title">优先级</div><div class="markers" id="priority-markers"></div><div class="marker-title">任务进度</div><div class="markers" id="progress-markers"></div><div class="marker-title">旗子</div><div class="markers" id="flag-markers"></div><p class="note">同类替换，异类可共存。<br>再次点击已选标记可移除。</p></div><div class="scenario"><h3>草图评审 · 状态切换</h3><select id="scenario" aria-label="切换演示场景"><option value="online">正常编辑</option><option value="offline">断网继续编辑</option><option value="failed">同步失败与重试</option><option value="remote">另一设备的修改</option><option value="conflict">删除与离线编辑冲突</option></select><button id="run-scenario">演示此场景</button><p id="scenario-note">这里的云端状态仅用于评审，未连接真实服务。</p></div></aside>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="overlay" id="overlay" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><header class="modal-head"><h2 id="dialog-title"></h2><button id="close-dialog" aria-label="关闭弹窗">×</button></header><div class="modal-body" id="dialog-body"></div></section></div>
